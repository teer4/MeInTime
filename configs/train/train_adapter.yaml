model:
  cldm:
    target: diffbir.model.cldm.ControlLDM
    params:
      latent_scale_factor: 0.18215
      unet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
        use_ip_adapter: True
      vae_cfg:
        embed_dim: 4
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
      clip_cfg:
        embed_dim: 1024
        vision_cfg:
          image_size: 224
          layers: 32
          width: 1280
          head_width: 80
          patch_size: 14
        text_cfg:
          context_length: 77
          vocab_size: 49408
          width: 1024
          heads: 16
          layers: 24
        layer: "penultimate"
      controlnet_cfg:
        use_checkpoint: True
        image_size: 32 # unused
        in_channels: 4
        hint_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_head_channels: 64 # need to fix for flash-attn
        use_spatial_transformer: True
        use_linear_in_transformer: True
        transformer_depth: 1
        context_dim: 1024
        legacy: False
        use_ip_adapter: False
      image_proj_model_cfg:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 16
        num_queries: 16
        embedding_dim: 512
        output_dim: 1024
        ff_mult: 4


  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8

  diffusion:
    target: diffbir.model.gaussian_diffusion.Diffusion
    params:
      beta_schedule: linear
      #cosine_s: 8e-3
      linear_start: 0.00085
      linear_end: 0.0120
      timesteps: 1000
      zero_snr: True
      parameterization: v

dataset:
  train:
    target: diffbir.dataset.face_adapter_dataset.FaceAdapterDataset
    params:
      jsonl_path: "/DiffBIR/FusedFaceDataset/train/triplets_train.jsonl"  # 👈 替换为你的 jsonl 路径
      root_dir: "/DiffBIR/FusedFaceDataset/train"
      prompt_text: "photo of a person"
  val:
    target: diffbir.dataset.face_adapter_dataset.FaceAdapterDataset
    params:
      jsonl_path: "/DiffBIR/FusedFaceDataset/val/triplets_val.jsonl"  # 👈 替换为你的 jsonl 路径
      root_dir: "/DiffBIR/FusedFaceDataset/val"
      prompt_text: "photo of a person"
        

train:
  # pretrained sd v2.1-zsnr path
  sd_path: "/DiffBIR/weights/v2-1_512-ema-pruned.ckpt"
  # experiment directory path
  exp_dir: "/DiffBIR/train_log"
  # stage 1 swinir path.
  # For DiffBIR v2.1, we use SwinIR trained on ImageNet-1k with RealESRGAN degradation.
  controlnet_path: "v1_face.pth"
  swinir_path: "/DiffBIR/weights/face_swinir_v1.ckpt"
  learning_rate: 5e-5
  batch_size: 24
  num_workers: 8
  train_steps: 250000
  log_every: 100
  ckpt_every: 10000
  image_every: 1000
  eval_every: 5000
  resume_path: 
  noise_aug_timestep: 0
  ema_decay: 0.999
